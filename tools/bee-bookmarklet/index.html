<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bee Hints</title>
<style>
  :root { color-scheme: light dark; --gold: #f7da21; --ok: #1a9a3a; --warn: #e0a800; --muted: #8888; }
  * { box-sizing: border-box }
  body { font: 16px/1.45 system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: gray; margin: 1.5rem 0 .5rem }
  .bar { display: flex; gap: .5rem; align-items: center; justify-content: space-between; flex-wrap: wrap }
  select { font: inherit; padding: .25rem }
  .hive { display: flex; gap: .4rem; margin: .75rem 0; flex-wrap: wrap }
  .hive span { width: 2.4rem; height: 2.4rem; display: grid; place-items: center; border-radius: 50%;
               font-weight: 700; background: var(--muted) }
  .hive span.c { background: var(--gold); color: #000 }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: .5rem }
  .stat { border: 1px solid var(--muted); border-radius: 8px; padding: .5rem .7rem }
  .stat b { display: block; font-size: 1.15rem }
  .stat small { color: gray }
  .progress { height: 8px; border-radius: 4px; background: var(--muted); margin-top: .5rem; overflow: hidden }
  .progress i { display: block; height: 100%; background: var(--gold) }
  table { border-collapse: collapse; width: 100%; text-align: center }
  th { color: gray; font-weight: 600; padding: .25rem }
  td { padding: .35rem .25rem; border: 2px solid transparent; border-radius: 6px; font-variant-numeric: tabular-nums }
  td.none { color: var(--muted) }
  td.untouched { background: #8883 }
  td.partial { background: #e0a80033; font-weight: 700 }
  td.done { background: #1a9a3a26; color: var(--ok); font-weight: 700 }
  td.sum { border-left: 1px solid var(--muted) }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem }
  .chip { padding: .15rem .55rem; border-radius: 999px; font-size: .9rem; font-variant-numeric: tabular-nums; background: #8883 }
  .chip.partial { background: #e0a80033; font-weight: 700 }
  .chip.done { background: #1a9a3a26; color: var(--ok); font-weight: 700 }
  .words { display: flex; flex-wrap: wrap; gap: .3rem .8rem }
  .words .pg { color: #c90; font-weight: 800; text-transform: uppercase }
  .empty { padding: 1rem; border: 1px dashed var(--muted); border-radius: 8px }
  footer { margin-top: 2rem; font-size: .8rem; color: gray }
</style>

<div class="bar">
  <h1>Bee Hints <span id="date"></span></h1>
  <select id="days" aria-label="Saved days" hidden></select>
</div>
<main id="app"></main>
<footer>Everything stays in this browser. The bookmarklet sends your found words here in the URL fragment, which servers never see.
  <a href="install.html">Set up the bookmarklet</a></footer>

<script>
"use strict";
var KEY = 'bee:v1:';
var $ = function (id) { return document.getElementById(id); };
var words = function (s) { return (s || '').split(',').filter(function (w) { return /^[a-z]{4,}$/.test(w); }); };
var uniq = function (a) { return Array.from(new Set(a)); };

/* NYT scoring: 4-letter words = 1 point, longer = its length, pangrams +7. */
function score(w) { var p = w.length === 4 ? 1 : w.length; return new Set(w).size === 7 ? p + 7 : p; }
var TIERS = [['Beginner', 0], ['Good Start', 2], ['Moving Up', 5], ['Good', 8], ['Solid', 15],
             ['Nice', 25], ['Great', 40], ['Amazing', 50], ['Genius', 70], ['Queen Bee', 100]];
function rank(pts, total) {
  var cur = 0;
  TIERS.forEach(function (t, i) { if (pts >= Math.floor(t[1] / 100 * total)) cur = i; });
  var next = TIERS[cur + 1];
  return { name: TIERS[cur][0], next: next ? next[0] : null, toNext: next ? Math.floor(next[1] / 100 * total) - pts : 0 };
}

/* Merge an incoming handoff (URL fragment) into local storage, unioning found words. */
function ingest() {
  var p = new URLSearchParams(location.hash.slice(1));
  if (!/^\d{4}-\d{2}-\d{2}$/.test(p.get('d') || '') || !p.get('a')) return null;
  var d = p.get('d'), old = JSON.parse(localStorage.getItem(KEY + d) || 'null');
  var rec = {
    d: d, id: p.get('id') || '',
    c: (p.get('c') || '').toLowerCase().slice(0, 1),
    o: (p.get('o') || '').toLowerCase().replace(/[^a-z]/g, '').slice(0, 6),
    a: words(p.get('a')), p: words(p.get('p')),
    f: uniq(words(p.get('f')).concat(old ? old.f : [])), t: Date.now()
  };
  localStorage.setItem(KEY + d, JSON.stringify(rec));
  history.replaceState(null, '', location.pathname);
  return d;
}

function savedDates() {
  return Object.keys(localStorage).filter(function (k) { return k.indexOf(KEY) === 0; })
    .map(function (k) { return k.slice(KEY.length); }).sort().reverse();
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function state(got, tot) { return got === tot ? 'done' : got === 0 ? 'untouched' : 'partial'; }

function render(date) {
  var app = $('app'); app.textContent = '';
  var rec = date && JSON.parse(localStorage.getItem(KEY + date) || 'null');
  if (!rec) {
    var e = el('div', 'empty');
    e.append('No puzzle yet. Run the bookmarklet on ');
    e.append(el('b', '', 'nytimes.com/puzzles/spelling-bee'));
    e.append(' and it will land here.');
    app.append(e); return;
  }
  $('date').textContent = rec.d;
  var answers = rec.a, found = rec.f.filter(function (w) { return answers.indexOf(w) >= 0; });
  var isFound = {}; found.forEach(function (w) { isFound[w] = 1; });
  var total = answers.reduce(function (s, w) { return s + score(w); }, 0);
  var pts = found.reduce(function (s, w) { return s + score(w); }, 0);
  var r = rank(pts, total), genius = Math.floor(0.7 * total);

  /* hive */
  var hive = el('div', 'hive');
  hive.append(el('span', 'c', rec.c.toUpperCase()));
  rec.o.split('').forEach(function (ch) { hive.append(el('span', '', ch.toUpperCase())); });
  app.append(hive);

  /* stats */
  var stats = el('div', 'stats');
  function stat(big, small) { var s = el('div', 'stat'); s.append(el('b', '', big), el('small', '', small)); stats.append(s); }
  stat(r.name, r.next ? '+' + r.toNext + ' to ' + r.next : 'top rank');
  stat(pts + ' / ' + total, pts >= genius ? 'Genius reached' : 'Genius at ' + genius + ' (+' + (genius - pts) + ')');
  stat(found.length + ' / ' + answers.length, 'words');
  app.append(stats);
  var bar = el('div', 'progress'), fill = el('i'); fill.style.width = Math.min(100, pts / total * 100) + '%';
  bar.append(fill); app.append(bar);

  /* grid: first letter x length */
  app.append(el('h2', '', 'Words by first letter and length'));
  var lens = uniq(answers.map(function (w) { return w.length; })).sort(function (a, b) { return a - b; });
  var firsts = uniq(answers.map(function (w) { return w[0]; })).sort();
  var t = el('table'), head = el('tr'); head.append(el('th'));
  lens.forEach(function (l) { head.append(el('th', '', String(l))); });
  head.append(el('th', '', 'Σ')); t.append(head);
  firsts.forEach(function (L) {
    var row = el('tr'), mine = answers.filter(function (w) { return w[0] === L; });
    row.append(el('th', '', L.toUpperCase()));
    lens.forEach(function (l) {
      var all = mine.filter(function (w) { return w.length === l; });
      var got = all.filter(function (w) { return isFound[w]; }).length;
      row.append(all.length ? el('td', state(got, all.length), got + '/' + all.length) : el('td', 'none', '·'));
    });
    var g = mine.filter(function (w) { return isFound[w]; }).length;
    row.append(el('td', state(g, mine.length) + ' sum', g + '/' + mine.length));
    t.append(row);
  });
  app.append(t);

  /* pangrams: total/found, and perfect (7 letters, each once) */
  app.append(el('h2', '', 'Pangrams'));
  var pg = rec.p, perfect = pg.filter(function (w) { return w.length === 7; });
  var pf = pg.filter(function (w) { return isFound[w]; }), pfp = perfect.filter(function (w) { return isFound[w]; });
  var pgs = el('div', 'stats');
  stats = pgs;
  stat(pf.length + ' / ' + pg.length, 'pangrams found');
  stat(perfect.length ? pfp.length + ' / ' + perfect.length : 'None today', 'perfect (7 letters)');
  app.append(pgs);
  var hidden = pg.filter(function (w) { return !isFound[w]; }).map(function (w) { return w.length + (w.length === 7 ? ' (perfect)' : ''); });
  app.append(el('p', '', hidden.length ? 'Still hidden: ' + hidden.join(', ') + ' letters' : 'All pangrams found!'));

  /* two-letter list */
  app.append(el('h2', '', 'Two-letter list'));
  var pre = {};
  answers.forEach(function (w) { var k = w.slice(0, 2); (pre[k] = pre[k] || { all: 0, got: 0 }).all++; if (isFound[w]) pre[k].got++; });
  var chips = el('div', 'chips');
  Object.keys(pre).sort().forEach(function (k) {
    var p = pre[k]; chips.append(el('span', 'chip ' + (p.got === p.all ? 'done' : p.got ? 'partial' : ''),
      k.toUpperCase() + ' ' + p.got + '/' + p.all));
  });
  app.append(chips);

  /* found words */
  app.append(el('h2', '', 'Found'));
  var list = el('div', 'words');
  found.slice().sort().forEach(function (w) { list.append(el('span', rec.p.indexOf(w) >= 0 ? 'pg' : '', w)); });
  app.append(list.childNodes.length ? list : el('p', '', 'Nothing found yet.'));
}

var sel = $('days');
sel.onchange = function () { render(sel.value); };

/* (Re)build the day picker and show a day. Runs on load and whenever the bookmarklet
   hands off again into this already-open tab (only the URL fragment changes). */
function show(date) {
  var days = savedDates();
  date = date || days[0];
  sel.textContent = '';
  days.forEach(function (d) { var o = el('option', '', d); o.value = d; sel.append(o); });
  sel.hidden = days.length < 2;
  sel.value = date;
  render(date);
}
show(ingest());
window.addEventListener('hashchange', function () { var d = ingest(); if (d) show(d); });
</script>

# Publishes only tools/bee-bookmarklet/ to GitHub Pages. Nothing else in the repo is deployed.
name: Deploy Bee Hints to Pages

on:
  push:
    branches: [main]
    paths: ['tools/bee-bookmarklet/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/bee-bookmarklet
      - id: deployment
        uses: actions/deploy-pages@v4
